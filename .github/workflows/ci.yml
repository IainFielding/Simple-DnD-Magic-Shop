# Continuous integration: every check `npm run check` runs locally, then a trial build of the
# release archive, verified from the outside.
#
# Runs on every push and pull request, and is also called by the release workflow (main.yml) as
# its gate — so a release can only ever be built from a commit that passes exactly this.
#
# The end-to-end harness (test-e2e/) is not run here. It drives a licensed Foundry install with
# real content packs, which a hosted runner does not have; run it locally before tagging.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Every script parses under V8 — catches the early errors ESLint's parser lets through,
      # like a #private member used but never declared, which takes the whole module down.
      - name: Validate Syntax
        run: npm run validate:syntax

      # Foundry parses these at load, and there is no build step to catch a stray comma.
      - name: Validate JSON
        run: npm run validate:json

      - name: Validate Localisation
        run: npm run validate:lang

      # Every file the manifest, the scripts and the stylesheets load exists, and sits inside
      # the folders the release archive contains.
      - name: Validate Package
        run: npm run validate:package

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      # Build the archive a release would ship, then unpack it with a different zip reader and
      # validate what came out. A packaging fault is found on the commit that caused it rather
      # than on release day.
      - name: Trial Release Build
        run: |
          node tools/build-release.mjs --version=0.0.0-ci.${{ github.run_number }} \
            --repo=${{ github.repository }} --tag=ci-${{ github.run_number }}
          unzip -tq dist/module.zip
          unzip -q dist/module.zip -d dist/unpacked
          node tools/validate-package.mjs --root=dist/unpacked --release
